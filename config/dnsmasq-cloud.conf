# Internet DNS (stands in for the Umbrella resolvers and public DNS).
# evil.example is the attacker's domain: lookups for it are sent on to the attacker's machine.
user=root
no-resolv
no-hosts
bind-interfaces
listen-address=203.0.113.53
log-queries
log-facility=-
address=/canvas.example/203.0.113.30
address=/hvac-vendor.example/203.0.113.20
server=/evil.example/203.0.113.66
