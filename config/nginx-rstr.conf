# Restricted-data web front ends: Banner / Patriot Web (.10) and the staff payment portal (.30).
user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr;

events { worker_connections 64; }

http {
    access_log /dev/stdout;
    ssl_certificate     /etc/ssl/certs/lab.crt;
    ssl_certificate_key /etc/ssl/private/lab.key;
    default_type text/plain;

    server {
        listen 10.10.110.10:443 ssl;
        server_name banner.campus.lab;
        location / { return 200 "Banner Self-Service (Patriot Web stand-in)\n"; }
    }

    server {
        listen 10.10.110.30:443 ssl;
        server_name pay.campus.lab;
        location / { return 200 "Payment portal (TouchNet stand-in)\n"; }
    }
}
