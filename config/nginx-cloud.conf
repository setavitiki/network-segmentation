# Cloud services on the Internet side: the HVAC vendor cloud and Canvas.
user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr;

events { worker_connections 64; }

http {
    access_log /dev/stdout;
    ssl_certificate     /etc/ssl/certs/lab.crt;
    ssl_certificate_key /etc/ssl/private/lab.key;

    server {
        listen 203.0.113.20:443 ssl;
        server_name hvac-vendor.example;
        root /srv/vendor;
        default_type application/json;
    }

    server {
        listen 203.0.113.30:443 ssl;
        server_name canvas.example;
        default_type text/plain;
        location / { return 200 "Canvas (cloud stand-in)\n"; }
    }
}
