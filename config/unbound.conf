# DNS for every zone (stands in for the Cisco Umbrella virtual appliance in CORE).
# Campus names go to the domain controller; everything else goes to the Internet resolver.
server:
    interface: 10.10.100.10
    access-control: 10.10.0.0/16 allow
    do-ip6: no
    chroot: ""
    username: "unbound"
    pidfile: "/run/unbound.pid"
    use-syslog: no
    logfile: ""
    verbosity: 1
    log-queries: yes
    module-config: "iterator"
    domain-insecure: "campus.lab"
    private-domain: "campus.lab"

forward-zone:
    name: "campus.lab."
    forward-addr: 10.10.105.10

forward-zone:
    name: "."
    forward-addr: 203.0.113.53
